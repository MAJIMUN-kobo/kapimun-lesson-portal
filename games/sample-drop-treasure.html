<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Unityで制作した[サンプル版] トレジャークリッカー。宝箱をクリックして宝石を集めるゲームです。">
    <title>[サンプル版] トレジャークリッカー - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    <header class="pixel-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">GameDev<span class="text-accent">.log</span></a>
            <nav>
                <ul>
                    <li><a href="../index.html#portfolio">Games</a></li>
                    <li><a href="../index.html#blog">Note Blogs</a></li>
                    <li><button class="theme-toggle" id="themeToggle">🌙 Dark</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="game-hero reveal-up">
        <div class="container">
            <div class="game-hero-content">
                <span class="card-tag tag-unity">Unity</span>
                <h1 class="game-title">[サンプル版] トレジャークリッカー</h1>
                <p class="game-catchphrase">宝箱をクリックして宝石を集めるクリッカーゲーム</p>
                <div class="game-actions">
                    <a href="https://unityroom.com/games/sample-drop-treasure" target="_blank" rel="noopener noreferrer" class="play-btn">▶ unityroomでプレイ</a>
                </div>
            </div>

            <div class="game-main-visual bg-unity" id="mainVisual">
                <img src="../images/drop-treasure-snap-gif-001.gif" alt="トレジャークリッカーのゲームプレイアニメーション">
            </div>

            <div class="screenshot-gallery" aria-label="ゲームのスクリーンショット">
                <div class="screenshot bg-unity" title="ゲームプレイのGIF">
                    <img src="../images/drop-treasure-snap-gif-001.gif" alt="ゲームプレイのアニメーション">
                </div>
                <div class="screenshot bg-unity" title="スクリーンショット 001">
                    <img src="../images/drop-treasure-snap-img-001.jpg" alt="宝箱と所持数の画面">
                </div>
                <div class="screenshot bg-unity" title="スクリーンショット 002">
                    <img src="../images/drop-treasure-snap-img-002.jpg" alt="宝石が宝箱から飛び出す画面">
                </div>
                <div class="screenshot bg-unity" title="スクリーンショット 003">
                    <img src="../images/drop-treasure-snap-img-003.jpg" alt="宝石を集めているゲーム画面">
                </div>
            </div>
        </div>
    </section>

    <section class="game-details reveal-up">
        <div class="container">
            <div class="details-grid">
                <div class="details-main">
                    <h2 class="section-title">Overview</h2>
                    <div class="pixel-box content-card">
                        <p>宝箱をクリックして宝石を集める、Unity製のクリッカーゲームです。unityroomでプレイできます。</p>
                    </div>
                </div>
                <div class="details-sidebar">
                    <h2 class="section-title">Info</h2>
                    <div class="pixel-box spec-card">
                        <ul>
                            <li><strong>Engine:</strong> Unity</li>
                            <li><strong>Genre:</strong> Clicker</li>
                            <li><strong>Platform:</strong> WebGL (unityroom)</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Your Name. Game Developer Portfolio.</p>
        </div>
    </footer>
</body>
</html>
